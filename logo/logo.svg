<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="48%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#ff5e5b" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App Icon Squircle Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#2c2c2c" stroke-width="2" />
  
  <!-- Subtle Energy Bars beneath curve -->
  <g fill="#1ed760" opacity="0.18">
    <rect x="22" y="86" width="10" height="16" rx="3" />
    <rect x="36" y="68" width="10" height="34" rx="3" />
    <rect x="50" y="46" width="10" height="56" rx="3" />
    <rect x="64" y="38" width="10" height="64" rx="3" />
    <rect x="78" y="44" width="10" height="58" rx="3" />
    <rect x="92" y="70" width="10" height="32" rx="3" />
    <rect x="106" y="88" width="10" height="14" rx="3" />
  </g>

  <!-- Glowing Energy Spline Arc -->
  <path d="M18 92 C 34 92, 44 40, 64 40 S 94 92, 110 92" 
        fill="none" 
        stroke="url(#arcGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Control Anchor Points -->
  <circle cx="18" cy="92" r="4.5" fill="#4cc9f0" />
  <circle cx="64" cy="40" r="5" fill="#1ed760" stroke="#121212" stroke-width="2" />
  <circle cx="110" cy="92" r="4.5" fill="#ff5e5b" />
</svg>
